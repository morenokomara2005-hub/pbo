<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Authentic - Login OOP</title>
    <style>
        /* --- CSS & UI/UX DESIGN --- */
        :root {
            --primary-city: #2c3e50;
            --accent-city: #34495e;
            --success-btn: #27ae60;
            --danger-btn: #e67e22; /* Oranye sesuai permintaan */
            --glass-bg: rgba(255, 255, 255, 0.15);
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Latar belakang perkotaan yang unik menggunakan gradien dan siluet */
            background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            background-attachment: fixed;
            position: relative;
            overflow: hidden;
        }

        /* Dekorasi Siluet Perkotaan Sederhana */
        body::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: 
                linear-gradient(transparent 70%, #000 100%),
                url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
            opacity: 0.3;
            z-index: -1;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
            z-index: 10;
        }

        h2 { color: var(--primary-city); margin-bottom: 20px; }
        .hidden { display: none; }

        .form-group { margin-bottom: 15px; }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary-city);
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-login { background-color: var(--success-btn); }
        .btn-login:hover { background-color: #219150; transform: translateY(-2px); }

        .btn-logout { background-color: var(--danger-btn); margin-top: 20px; }
        .btn-logout:hover { background-color: #d35400; transform: translateY(-2px); }

        .welcome-text {
            font-size: 20px;
            color: #444;
            margin-bottom: 10px;
        }

        .user-highlight {
            color: var(--primary-city);
            font-weight: bold;
            text-transform: capitalize;
        }
    </style>
</head>
<body>

    <div id="login-view" class="container">
        <h2>City Login</h2>
        <div class="form-group">
            <input type="text" id="username" placeholder="Username">
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Password">
        </div>
        <button class="btn btn-login" onclick="app.actionLogin()">MASUK</button>
    </div>

    <div id="profile-view" class="container hidden">
        <h2>Dashboard</h2>
        <div class="welcome-text">Hai, <span id="user-info" class="user-highlight"></span>!</div>
        <p>Selamat datang di sistem manajemen kota.</p>
        <button class="btn btn-logout" onclick="app.actionLogout()">KELUAR</button>
    </div>

    <script>
        /**
         * CLASS: AuthManager (Model & Controller)
         * Mengimplementasikan OOP untuk manajemen autentikasi
         */
        class AuthManager {
            constructor() {
                // Database Statis awal (JSON)
                this.defaultUsers = [
                    { username: "moreno", password: "123", role: "user" },
                    { username: "admin", password: "admin", role: "admin" },
                    { username: "guest", password: "guest", role: "guest" }
                ];

                // Inisialisasi Database ke LocalStorage jika belum ada
                this.initDB();
                // Jalankan render awal untuk cek session
                this.render();
            }

            // Method: Menyimpan data user awal ke LocalStorage (Simulasi I/O)
            initDB() {
                if (!localStorage.getItem('user_db')) {
                    localStorage.setItem('user_db', JSON.stringify(this.defaultUsers));
                }
            }

            // Method: Proses Verifikasi Login
            validateLogin(inputUser, inputPass) {
                const db = JSON.parse(localStorage.getItem('user_db'));
                const userMatch = db.find(u => u.username === inputUser && u.password === inputPass);

                if (userMatch) {
                    // Simpan status login (Session)
                    localStorage.setItem('session_active', JSON.stringify(userMatch));
                    return true;
                }
                return false;
            }

            // Method: Proses Logout
            clearSession() {
                localStorage.removeItem('session_active');
                this.render();
            }

            // Method: Update UI berdasarkan state (View Controller)
            render() {
                const session = localStorage.getItem('session_active');
                const loginView = document.getElementById('login-view');
                const profileView = document.getElementById('profile-view');
                const infoText = document.getElementById('user-info');

                if (session) {
                    const currentUser = JSON.parse(session);
                    loginView.classList.add('hidden');
                    profileView.classList.remove('hidden');
                    infoText.innerText = currentUser.username;
                } else {
                    loginView.classList.remove('hidden');
                    profileView.classList.add('hidden');
                }
            }

            // Method untuk menangani event klik Login
            actionLogin() {
                const u = document.getElementById('username').value;
                const p = document.getElementById('password').value;

                if (this.validateLogin(u, p)) {
                    this.render();
                } else {
                    alert("Gagal login! Username atau password tidak sesuai.");
                }
            }

            // Method untuk menangani event klik Logout
            actionLogout() {
                this.clearSession();
            }
        }

        // INSTANSIASI OBJECT (Entry Point)
        const app = new AuthManager();
    </script>
</body>
</html>
