<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Login OOP Modern</title>
    <style>
        /* CSS & UI/UX DESIGN */
        :root {
            --primary-bg: #667eea;
            --secondary-bg: #764ba2;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --text-dark: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Latar belakang unik dengan gradien dan pola mesh */
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .hidden { display: none; }

        h2 { color: var(--text-dark); margin-bottom: 25px; }

        .input-group { margin-bottom: 15px; }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus { border-color: var(--primary-bg); }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s, background 0.3s;
        }

        .btn-login {
            background-color: var(--success-color);
            color: white;
        }

        .btn-logout {
            background-color: var(--danger-color);
            color: white;
            margin-top: 20px;
        }

        .btn:active { transform: scale(0.98); }

        .profile-info {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
        }

        .username-highlight {
            color: var(--secondary-bg);
            font-weight: bold;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <div id="login-page" class="card">
            <h2>Sign In</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="Username">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password">
            </div>
            <button class="btn btn-login" onclick="authApp.handleLogin()">LOGIN</button>
        </div>

        <div id="profile-page" class="card hidden">
            <h2>User Profile</h2>
            <div class="profile-info">
                <p>Selamat Datang,</p>
                <p id="display-user" class="username-highlight"></p>
                <p>Status: <span style="color: green;">Online</span></p>
            </div>
            <button class="btn btn-logout" onclick="authApp.handleLogout()">LOGOUT</button>
        </div>

    </div>

    <script>
        // IMPLEMENTASI OOP
        class AuthSystem {
            constructor() {
                // Database User Sesuai Permintaan
                this.userData = [
                    { username: "moreno", password: "123" },
                    { username: "admin", password: "admin" },
                    { username: "guest", password: "guest" }
                ];
                
                // Inisialisasi Database ke LocalStorage
                this.initStorage();
                // Jalankan pengecekan sesi otomatis saat aplikasi dibuka
                this.render();
            }

            // Method: Menyimpan data user ke LocalStorage (Simulasi File I/O)
            initStorage() {
                if (!localStorage.getItem('users')) {
                    localStorage.setItem('users', JSON.stringify(this.userData));
                }
            }

            // Method: Validasi Login
            login(inputUser, inputPass) {
                const users = JSON.parse(localStorage.getItem('users'));
                const foundUser = users.find(u => u.username === inputUser && u.password === inputPass);

                if (foundUser) {
                    localStorage.setItem('session', JSON.stringify(foundUser));
                    return true;
                }
                return false;
            }

            // Method: Logout
            logout() {
                localStorage.removeItem('session');
                this.render();
            }

            // Method: Mengatur tampilan halaman (UI Controller)
            render() {
                const session = localStorage.getItem('session');
                const loginPage = document.getElementById('login-page');
                const profilePage = document.getElementById('profile-page');
                const displayUser = document.getElementById('display-user');

                if (session) {
                    const user = JSON.parse(session);
                    loginPage.classList.add('hidden');
                    profilePage.classList.remove('hidden');
                    displayUser.textContent = `Hai, ${user.username}`;
                } else {
                    loginPage.classList.remove('hidden');
                    profilePage.classList.add('hidden');
                }
            }

            // Method: Handler Button Login
            handleLogin() {
                const userField = document.getElementById('username');
                const passField = document.getElementById('password');

                if (this.login(userField.value, passField.value)) {
                    this.render();
                    userField.value = '';
                    passField.value = '';
                } else {
                    alert("Gagal Login! Username atau Password salah.");
                }
            }

            // Method: Handler Button Logout
            handleLogout() {
                this.logout();
            }
        }

        // INSTANSIASI OBJECT
        const authApp = new AuthSystem();
    </script>
</body>
</html>
